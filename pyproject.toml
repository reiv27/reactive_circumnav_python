[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reactive-circumnav-sim"
version = "0.1.0"
description = "Educational control-engineering simulator for Dubins vehicles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2",
]
viz = [
    "matplotlib>=3.5",
]
rl = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.0",
]

[project.scripts]
circumnav-heading-demo = "circumnav.examples.heading_control:main"
circumnav-reactive-demo = "circumnav.examples.reactive_circumnav:main"
circumnav-delay-sweep = "circumnav.examples.delay_sweep:main"
circumnav-delay-compare = "circumnav.examples.delay_compare:main"
circumnav-predictor-compare = "circumnav.examples.predictor_compare:main"
circumnav-rl-train = "circumnav.examples.rl_train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
